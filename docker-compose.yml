version: '3.9'

services:

  db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_DB: educrm
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  backend:
    build: .

    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:admin@db:5432/educrm}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

    ports:
      - "8000:8000"

    volumes:
      - .:/code

    depends_on:
      - db

volumes:
  postgres_data:
